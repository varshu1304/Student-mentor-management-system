<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="frontPage.css">
</head>
<body>

    <!-- Navbar with Role Selection -->
    <nav class="navbar">
        <h1></h1>
        <ul>
            <li onclick="showLogin('mentor')" id="mentor-tab">Mentor</li>
            <li onclick="showLogin('student')" id="student-tab" class="active">Student</li>
        </ul>
    </nav>

    <!-- Login Section -->
    <div class="container">
        <div class="login-box">
            <h2 id="login-title">Student Login</h2>
            <form id="loginForm">
                <input type="email" id="email" placeholder="Email" required>
                <input type="password" id="password" placeholder="Password" required>
                <button type="submit">Login</button>
            </form>
            <p class="error-message" id="errorMessage"></p>
        </div>
    </div>

    <script>
        let selectedRole = "student";
    
        function showLogin(role) {
            selectedRole = role;
            document.getElementById("login-title").textContent = role.charAt(0).toUpperCase() + role.slice(1) + " Login";
    
            document.querySelectorAll(".navbar ul li").forEach(tab => tab.classList.remove("active"));
            document.getElementById(role + "-tab").classList.add("active");
        }
    
        document.getElementById("loginForm").addEventListener("submit", async function (e) {
            e.preventDefault();
    
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;
    
            const endpoint = `http://127.0.0.1:5000/${selectedRole}s`;
    
            try {
                const res = await fetch(endpoint);
                const users = await res.json();
    
                const user = users.find(u => u.email === email && u.password === password);
    
                if (user) {
                    if (selectedRole === "student") {
                        localStorage.setItem("student", JSON.stringify(user));
                        window.location.href = "student_dashboard.html";
                    } else if (selectedRole === "mentor") {
                        localStorage.setItem("mentor", JSON.stringify(user));
                        window.location.href = "mentor_dashboard.html";
                    } else if (selectedRole === "admin") {
                        localStorage.setItem("admin", JSON.stringify(user));
                        window.location.href = "admin-dashboard.html";
                    }
                } else {
                    document.getElementById("errorMessage").textContent = "Invalid credentials!";
                }
            } catch (error) {
                console.error("Fetch error:", error);
                document.getElementById("errorMessage").textContent = "Something went wrong!";
            }
        });
    </script>
    
</body>
</html>
